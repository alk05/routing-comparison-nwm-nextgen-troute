# $ python3 -m nwm_routing -f -V4 troute.yaml
#--------------------------------------------------------------------------------
log_parameters:
    #----------
    showtiming: True
    log_level : DEBUG
#--------------------------------------------------------------------------------
network_topology_parameters:
    #----------
    supernetwork_parameters:
        #----------
        geo_file_path: domain/RouteLink_CONUS.nc
        mask_file_path: domain/${MASK_FILE_PATH}
        network_type: 'NHDNetwork'
        columns:
            key: 'link'
            downstream: 'to'
            dx : 'Length'
            n : 'n'
            ncc : 'nCC'
            s0 : 'So'
            bw : 'BtmWdth'
            waterbody : 'NHDWaterbodyComID'
            gages : 'gages'
            tw : 'TopWdth'
            twcc : 'TopWdthCC'
            musk : 'MusK'
            musx : 'MusX'
            cs : 'ChSlp'
            alt: 'alt'
    waterbody_parameters:
        #----------
        break_network_at_waterbodies: False
#--------------------------------------------------------------------------------
compute_parameters:
    #----------
    parallel_compute_method: by-subnetwork-jit-clustered #serial
    compute_kernel         : V02-structured
    assume_short_ts        : True
    subnetwork_target_size : 1000
    cpu_pool               : ${N_CPUS}
    restart_parameters:
        #----------
        start_datetime: ${START_DATETIME}
        wrf_hydro_channel_restart_file        : restart/troute_restart.nc
        wrf_hydro_channel_ID_crosswalk_file   : restart/crosswalk.nc
        wrf_hydro_channel_restart_input_type : reorder
        wrf_hydro_channel_ID_crosswalk_file_field_name : link
        wrf_hydro_channel_restart_upstream_flow_field_name : qlink1
        wrf_hydro_channel_restart_downstream_flow_field_name : qlink2
        wrf_hydro_channel_restart_depth_flow_field_name : hlink
    forcing_parameters:
        #----------
        qts_subdivisions            : 12
        dt                          : 300 # [sec]
        qlat_input_folder           : channel_forcing
        qlat_file_pattern_filter    : "*.CHRTOUT_DOMAIN1"
        nts                         : ${NTS} # 288 for 1day; 2592 for 9 days
        max_loop_size               : ${MAX_LOOP_SIZE}   # [hr]
        # max_loop_size == nts so that output is single file
    data_assimilation_parameters:
        usgs_timeslices_folder : domain/  # The da input reader will fail without a dummy input for these lines.
        usace_timeslices_folder : domain/  # So, we give "domain/" which has no timeslices in it and the reader is happy.
        streamflow_da:
            #----------
            streamflow_da: True
            da_from_feather : da/troute_da.feather
            streamflow_nudging: True
            diffusive_streamflow_nudging: False
            gage_segID_crosswalk_file : domain/RouteLink_CONUS.nc  # Possibly not actually used, but unprotected in the reader call
            crosswalk_gage_field : 'gage'  # Possibly not actually used, but unprotected in the reader call
            crosswalk_segID_field : 'link'  # Possibly not actually used, but unprotected in the reader call
        reservoir_da:
            #----------
            reservoir_persistence_da:
                #----------
                reservoir_persistence_usgs: False
                reservoir_persistence_usace: False
            reservoir_rfc_da:
                #----------
                reservoir_rfc_forecasts: False
                reservoir_rfc_forecasts_time_series_path: rfc_timeseries/
                reservoir_rfc_forecasts_lookback_hours: 28
                reservoir_rfc_forecasts_offset_hours: 28
#--------------------------------------------------------------------------------
output_parameters:
    stream_output:
        stream_output_directory: outputs/troute/
        stream_output_time: -1 # -1 adds all outputs to a single file
        stream_output_type: ".nc" #please select only between netcdf '.nc' or '.csv' or '.pkl'
        stream_output_internal_frequency: 60 #[min] it should be order of 5 minutes. For instance if you want to output every hour put 60
